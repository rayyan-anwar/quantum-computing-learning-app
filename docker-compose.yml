services:
  quantum-computing-learning-app:
    build: .
    ports:
      - "8018:8018"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8018/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
